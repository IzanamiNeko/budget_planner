<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BudgetPlanner — Interaktiver Monatsbudget-Planer</title>
    <meta name="description" content="Interaktiver Monatsbudget-Planer mit Live-Fortschrittsanzeige, Ausgaben-Kategorien, Sparzielen und Schuldenplan." />
    <meta property="og:title" content="BudgetPlanner — Interaktiver Monatsbudget-Planer" />
    <meta property="og:description" content="Interaktiver Monatsbudget-Planer mit Live-Fortschrittsanzeige, Ausgaben-Kategorien, Sparzielen und Schuldenplan." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BudgetPlan" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('budgetplanner_theme_v1');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var useDark = stored === 'dark' || (stored === null && prefersDark);
          var root = document.documentElement;
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (useDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
            if (themeMeta) themeMeta.setAttribute('content', '#020617');
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
            if (themeMeta) themeMeta.setAttribute('content', '#f8fafc');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-emerald-600/15 selection:text-emerald-800 dark:selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
